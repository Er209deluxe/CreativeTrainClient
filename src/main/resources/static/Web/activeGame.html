<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/Web/stylesheet.css">
<link rel="icon" type="image/x-icon" href="/TrainFavicon.ico">

<title>Active Game</title>

</head><body class="active-game">

    <div class="game-header">
        <div class="headerElement">
            <button>Guide book</button>
        </div>

        <div class="headerElement game-timer">
            <h1 id="timer"></h1>
        </div>

        <div class="headerElement coin-display">
            <h1>🪙 <span id="coinCount">0</span></h1>
        </div>
    </div>

    <main class="game-layout">

        <section class="game-main">

            <div class="quest-panel">
                <div>
                    <span class="section-label">CURRENT QUEST</span>
                    <h2 id="quest">no quest</h2>
                </div>

                <div class="quest-actions">
                    <input
                        type="text"
                        id="questInput"
                        placeholder="Enter quest"
                    >
                    <button onclick="completeQuest()">
                        Complete
                    </button>
                </div>
            </div>

            <div class="status-panel">

                <div class="status-card sanity">
                    <span>Sanity</span>
                    <progress
                        id="sanityBar"
                        value="1"
                        max="1"
                    ></progress>
                </div>

                <div class="status-card depression">
                    <span>Depression</span>
                    <progress
                        id="depressionBar"
                        value="1"
                        max="1"
                    ></progress>
                </div>

            </div>

            <div class="game-columns">

                <section class="game-card inventory-card">
                    <div class="card-header">
                        <h2>Inventory</h2>

                        <button
                            class="small-button"
                            onclick="loadInventory()"
                        >
                            Refresh
                        </button>
                    </div>

                    <div id="Inventory"></div>
                </section>

                <section class="game-card shop-card">
                    <div class="card-header">
                        <h2>Shop</h2>
                    </div>

                    <div id="Shop"></div>
                </section>

                <section class="game-card dropped-card">
                    <div class="card-header">
                        <h2>Dropped Items</h2>
                    </div>

                    <div id="droppedItemsList"></div>
                </section>

            </div>
            <button onclick="openTransferDropsPopup()">
                Pick Up Dropped Items
            </button>

            <div class="bottom-actions">

                <button
                    id="changeRoleButton"
                    onclick="changeRole()"
                    style="display: none;"
                >
                    Change Role
                </button>

                <button
                    class="leave-button"
                    onclick="leaveSession()"
                >
                    Leave Game
                </button>

            </div>

        </section>

    </main>


    <div id="playerPopup" class="popup hidden">
        <div class="popup-content">

            <h2
                class="centerContent"
                id="gameResult"
            >
                Game Result
            </h2>

            <div id="winner"></div>
            <div id="reason"></div>

            <div class="teams">

                <div class="team-section" id="KILLER">
                    <h3 style="color:#d90408;">
                        Killers
                    </h3>
                    <div class="player-list"></div>
                </div>

                <div class="team-section" id="CIVILIAN">
                    <h3 style="color:#02d926;">
                        Civilians
                    </h3>
                    <div class="player-list"></div>
                </div>

                <div class="team-section" id="NEUTRAL">
                    <h3 style="color:#888;">
                        Neutrals
                    </h3>
                    <div class="player-list"></div>
                </div>

            </div>

            <button onclick="closePopup()">
                Close
            </button>

        </div>
    </div>

    <script src="/Web/ApiRequester.js?ts=1"></script>

</body>
</html>

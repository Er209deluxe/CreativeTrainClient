name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods if needed
        run: |
          if [ -f Podfile ]; then
            brew install cocoapods
            pod install --repo-update
          fi

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/MyApp.app"

          test -d "$APP_PATH" || {
            echo "App not found at $APP_PATH"
            find build -name "*.app" -print
            exit 1
          }

          rm -rf Payload MyApp-trollstore.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -r -y MyApp-trollstore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-trollstore-ipa
          path: MyApp-trollstore.ipa
